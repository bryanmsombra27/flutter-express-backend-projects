<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Socket</title>
</head>

<h1>Cliente Socket</h1>

<body>

    <script src="socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on("connect", () => {
            console.log("conectado con el socket server")

        })
        socket.on("disconnect", () => {
            console.log("desconectado del server")
        })

        socket.emit("mensaje", {
            nombre: "koso",

        })

        socket.on("active-bands", (payload) => {
            console.clear()
            console.table(payload, "BANDS")
        })

        socket.on("nuevo-mensaje", function (payload) {
            console.log(payload, "payload de flutter")
        })


    </script>

</body>

</html>
